<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css" >
    <title>Álvaro Miguel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Álvaro Miguel</h1>
        
        <div class="row text-center">
            
            <div class="col-md-4">
                <a class="d-block mb-2" data-bs-toggle="collapse" href="#sobreMim" role="button" aria-expanded="false" aria-controls="sobreMim">
                    <h3>Sobre Mim</h3>
                </a>
                <div class="collapse" id="sobreMim">
                    <div class="card card-body">
                        <p>Olá! Sou desenvolvedor FullStack apaixonado por tecnologia.</p>
                    </div>
                </div>
            </div>

            <!-- Tecnologias -->
            <div class="col-md-4">
                <a class="d-block mb-2" data-bs-toggle="collapse" href="#tecnologias" role="button" aria-expanded="false" aria-controls="tecnologias">
                    <h3>Tecnologias</h3>
                </a>
                <div class="collapse" id="tecnologias">
                    <div class="card card-body">
                        <p>HTML, CSS, JavaScript, Bootstrap, Spring Boot...</p>
                    </div>
                </div>
            </div>

            <!-- Redes Sociais -->
            <div class="col-md-4">
                <a class="d-block mb-2" data-bs-toggle="collapse" href="#redesSociais" role="button" aria-expanded="false" aria-controls="redesSociais">
                    <h3>Redes Sociais</h3>
                </a>
                <div class="collapse" id="redesSociais">
                    <div class="card card-body">
                        <p><a href="#">LinkedIn</a> | <a href="#">GitHub</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
